name: Build and Deploy Website Temp

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ai-harness-website
  RELEASE_NAME: ai-harness-website-temp
  NAMESPACE: websites
  HOSTNAME: website.app.ai-harness.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract ACR name from login server
        id: acr
        run: |
          LOGIN_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          ACR_NAME="${LOGIN_SERVER%%.*}"
          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tag dd.mm.yyyy.N
        id: tag
        run: |
          DATE_TAG=$(date +'%d.%m.%Y')
          EXISTING_COUNT=$(az acr repository show-tags \
            -n "${{ steps.acr.outputs.acr_name }}" \
            --repository "${IMAGE_NAME}" \
            --query "[?starts_with(@, '${DATE_TAG}.')]|length(@)" -o tsv 2>/dev/null || echo 0)
          NEXT=$((EXISTING_COUNT + 1))
          IMAGE_TAG="${DATE_TAG}.${NEXT}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: |
            type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:temp-latest

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Ensure namespace exists
        run: |
          kubectl get ns "${NAMESPACE}" >/dev/null 2>&1 || kubectl create ns "${NAMESPACE}"

      - name: Deploy with Helm
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"

          helm upgrade --install "${RELEASE_NAME}" ./helm \
            --namespace "${NAMESPACE}" \
            --set fullnameOverride="${RELEASE_NAME}" \
            --set image.repository="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=IfNotPresent \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host="${HOSTNAME}" \
            --set ingress.hosts[0].paths[0].path="/" \
            --set ingress.hosts[0].paths[0].pathType="Prefix" \
            --set ingress.tls[0].hosts[0]="${HOSTNAME}" \
            --set ingress.tls[0].secretName="website-app-ai-harness-com-tls"
